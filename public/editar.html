  <!DOCTYPE html>
  <html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente - GINPAC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="bg-gradient-to-br from-slate-50 to-slate-100">
    <div class="min-h-screen p-4">
      <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="mb-8">
          <a href="/listar" class="inline-block bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition">
            ← Volver al Listado
          </a>
        </div>

        <!-- Formulario -->
        <div class="bg-white rounded-lg shadow-lg p-8">
          <h1 class="text-3xl font-bold text-slate-900 mb-8">Editar Paciente</h1>
          
          <form id="formEditar" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="cedula" class="block text-sm font-semibold text-slate-700 mb-2">Cédula</label>
                <input type="text" id="cedula" disabled title="Cédula del paciente" placeholder="Cédula" aria-disabled="true" class="w-full px-4 py-2 border border-slate-300 rounded-lg bg-slate-100">
              </div>
              <div>
                <label for="nombres" class="block text-sm font-semibold text-slate-700 mb-2">Nombres</label>
                <input type="text" id="nombres" title="Nombres del paciente" placeholder="Ingrese los nombres" required aria-required="true" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="apellidos" class="block text-sm font-semibold text-slate-700 mb-2">Apellidos</label>
                <input type="text" id="apellidos" required title="Apellidos del paciente" placeholder="Ingrese los apellidos" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label for="telefono" class="block text-sm font-semibold text-slate-700 mb-2">Teléfono</label>
                <input type="tel" id="telefono" required title="Teléfono del paciente" placeholder="Ingrese el teléfono" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <div>
              <label for="fechaNacimiento" class="block text-sm font-semibold text-slate-700 mb-2">Fecha de Nacimiento</label>
              <input type="date" id="fechaNacimiento" title="Fecha de nacimiento del paciente" placeholder="Ingrese la fecha de nacimiento" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
              Guardar Cambios
            </button>
          </form>

          <div id="mensaje" class="mt-6 p-4 rounded-lg hidden"></div>
        </div>
      </div>
    </div>

    <script>
      const cedula = new URLSearchParams(window.location.search).get('cedula') || window.location.pathname.split('/').pop();

      async function cargarPaciente() {
        try {
          const response = await fetch(`/api/buscar/${cedula}`);
          const result = await response.json();

          if (result.datos) {
            document.getElementById('cedula').value = result.datos.cedula;
            document.getElementById('nombres').value = result.datos.nombres;
            document.getElementById('apellidos').value = result.datos.apellidos;
            document.getElementById('telefono').value = result.datos.telefono;
            document.getElementById('fechaNacimiento').value = result.datos.fechaNacimiento;
          }
        } catch (error) {
          console.error('Error:', error);
        }
      }

      document.getElementById('formEditar').addEventListener('submit', async (e) => {
        e.preventDefault();

        const paciente = {
          cedula,
          nombres: document.getElementById('nombres').value,
          apellidos: document.getElementById('apellidos').value,
          telefono: document.getElementById('telefono').value,
          fechaNacimiento: document.getElementById('fechaNacimiento').value
        };

        try {
          const response = await fetch('/api/actualizar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(paciente)
          });

          const result = await response.json();
          const mensajeDiv = document.getElementById('mensaje');

          if (result.exitoso) {
            mensajeDiv.className = 'mt-6 p-4 rounded-lg bg-green-100 text-green-800';
            mensajeDiv.textContent = 'Paciente actualizado exitosamente';
            setTimeout(() => window.location.href = '/listar', 2000);
          } else {
            mensajeDiv.className = 'mt-6 p-4 rounded-lg bg-red-100 text-red-800';
            mensajeDiv.textContent = result.mensaje;
          }
          mensajeDiv.classList.remove('hidden');
        } catch (error) {
          console.error('Error:', error);
        }
      });

      cargarPaciente();
    </script>
  </body>
  </html>
